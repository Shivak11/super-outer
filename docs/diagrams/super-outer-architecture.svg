<rect width="1440" height="1460" fill="#FFFFFF"/>
<text x="40" y="62" font-size="42" font-weight="800" fill="#13294B">Super-outer</text>
<text x="40" y="100" font-size="20" fill="#344054">How the parts connect in version 6.6.0, as built on 18 November 2026</text>
<rect x="1060" y="26" width="350" height="78" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="1078" y="40" width="42" height="20" rx="5" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
<text x="1132" y="56" font-size="17" fill="#1F2937">Live</text>
<rect x="1078" y="72" width="42" height="20" rx="5" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1132" y="88" font-size="17" fill="#1F2937">Built and switched off, or planned</text>
<rect x="30" y="140" width="220" height="580" rx="16" fill="#E7F5FF" stroke="#1971C2" stroke-width="2.5"/>
<text x="50" y="174" font-size="25" font-weight="800" fill="#1864AB">Owner</text>
<path d="M50 190h170a10 10 0 0 1 10 10v58a10 10 0 0 1-10 10H96l-20 16v-16H60a10 10 0 0 1-10-10v-58a10 10 0 0 1 10-10z" fill="#FFFFFF" stroke="#1971C2" stroke-width="2"/>
<text x="64" y="222" font-size="17" fill="#1F2937">“Add Google</text>
<text x="64" y="246" font-size="17" fill="#1F2937">sign-in to my app”</text>
<rect x="50" y="300" width="180" height="220" rx="10" fill="#FFFFFF" stroke="#1971C2" stroke-width="2"/>
<text x="64" y="330" font-size="21" font-weight="700" fill="#1864AB">Coding agent</text>
<text x="64" y="356" font-size="16" fill="#344054">Claude Code,</text>
<text x="64" y="378" font-size="16" fill="#344054">Codex or Cursor.</text>
<rect x="370" y="140" width="640" height="720" rx="16" fill="#FFF4E6" stroke="#E8590C" stroke-width="2.5"/>
<text x="390" y="174" font-size="25" font-weight="800" fill="#D9480F">Super-outer, on the owner's computer</text>
<rect x="390" y="192" width="270" height="150" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
<text x="404" y="222" font-size="21" font-weight="700" fill="#D9480F">Router skill</text>
<text x="404" y="248" font-size="16" fill="#344054">The only part that talks to</text>
<text x="404" y="270" font-size="16" fill="#344054">the owner. Reads the</text>
<text x="404" y="292" font-size="16" fill="#344054">project's own rules first.</text>
<rect x="390" y="392" width="270" height="190" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
<text x="404" y="422" font-size="21" font-weight="700" fill="#D9480F">Prompt hook</text>
<text x="404" y="448" font-size="16" fill="#344054">Runs on each typed prompt,</text>
<text x="404" y="470" font-size="16" fill="#344054">at session start, on tool</text>
<text x="404" y="492" font-size="16" fill="#344054">calls and at each turn end.</text>
<rect x="390" y="632" width="270" height="130" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
<text x="404" y="662" font-size="21" font-weight="700" fill="#D9480F">Cursor bridge</text>
<text x="404" y="688" font-size="16" fill="#344054">Runs the same hook in</text>
<text x="404" y="710" font-size="16" fill="#344054">Cursor, which has no</text>
<text x="404" y="732" font-size="16" fill="#344054">session-start event.</text>
<rect x="740" y="192" width="250" height="150" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
<text x="754" y="222" font-size="21" font-weight="700" fill="#D9480F">12 specialists</text>
<text x="754" y="248" font-size="16" fill="#344054">Security, data, frontend</text>
<text x="754" y="270" font-size="16" fill="#344054">and nine more. They give</text>
<text x="754" y="292" font-size="16" fill="#344054">findings, never questions.</text>
<rect x="740" y="382" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
<text x="754" y="412" font-size="21" font-weight="700" fill="#D9480F">6 review agents</text>
<text x="754" y="438" font-size="16" fill="#344054">Check finished work apart</text>
<text x="754" y="460" font-size="16" fill="#344054">from the agent that built it.</text>
<rect x="740" y="600" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
<text x="754" y="630" font-size="21" font-weight="700" fill="#D9480F">Tool check</text>
<text x="754" y="656" font-size="16" fill="#344054">Looks up the project's</text>
<text x="754" y="678" font-size="16" fill="#344054">packages, skills and servers.</text>
<rect x="740" y="740" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
<text x="754" y="770" font-size="21" font-weight="700" fill="#D9480F">Command layer</text>
<text x="754" y="796" font-size="16" fill="#344054">The super-outer command</text>
<text x="754" y="818" font-size="16" fill="#344054">that keeps the records.</text>
<rect x="1050" y="140" width="360" height="252" rx="16" fill="#FFF4E6" stroke="#E8590C" stroke-width="2.5"/>
<text x="1070" y="174" font-size="25" font-weight="800" fill="#D9480F">Skills that ship with it</text>
<text x="1070" y="206" font-size="17" font-weight="700" fill="#1F2937">Draw system diagram</text>
<text x="1070" y="227" font-size="16" fill="#344054">Draws diagrams like this one.</text>
<text x="1070" y="255" font-size="17" font-weight="700" fill="#1F2937">Jev opportunities</text>
<text x="1070" y="276" font-size="16" fill="#344054">Finds model calls with fixed answers.</text>
<text x="1070" y="304" font-size="17" font-weight="700" fill="#1F2937">Caveman opportunities</text>
<text x="1070" y="325" font-size="16" fill="#344054">Finds text that only machines read.</text>
<text x="1070" y="353" font-size="17" font-weight="700" fill="#1F2937">Edge cases</text>
<text x="1070" y="374" font-size="16" fill="#344054">Ranks the common ways a change breaks.</text>
<rect x="1050" y="410" width="360" height="450" rx="16" fill="#EBFBEE" stroke="#0B8A5F" stroke-width="2.5"/>
<text x="1070" y="444" font-size="25" font-weight="800" fill="#087F5B">Outside services</text>
<rect x="1070" y="462" width="320" height="150" rx="10" fill="#FFFFFF" stroke="#0B8A5F" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1084" y="492" font-size="21" font-weight="700" fill="#087F5B">Jev, through OpenRouter</text>
<text x="1084" y="518" font-size="16" fill="#344054">Reads up to 1,500 characters</text>
<text x="1084" y="540" font-size="16" fill="#344054">of the typed request. Off</text>
<text x="1084" y="562" font-size="16" fill="#344054">until the owner adds a key.</text>
<rect x="1190" y="630" width="200" height="160" rx="10" fill="#FFFFFF" stroke="#0B8A5F" stroke-width="2"/>
<text x="1204" y="660" font-size="21" font-weight="700" fill="#087F5B">Public registries</text>
<text x="1204" y="686" font-size="16" fill="#344054">npm, PyPI, skills.sh,</text>
<text x="1204" y="708" font-size="16" fill="#344054">the MCP Registry,</text>
<text x="1204" y="730" font-size="16" fill="#344054">GitHub and unpkg.</text>
<rect x="30" y="900" width="420" height="240" rx="16" fill="#E3FAFC" stroke="#0C8599" stroke-width="2.5"/>
<text x="50" y="934" font-size="25" font-weight="800" fill="#0B7285">Install and checks</text>
<text x="50" y="966" font-size="17" font-weight="700" fill="#1F2937">npm run setup</text>
<text x="50" y="988" font-size="16" fill="#344054">Installs it in Claude Code and Codex.</text>
<text x="50" y="1022" font-size="17" font-weight="700" fill="#1F2937">npm run install:cursor</text>
<text x="50" y="1044" font-size="16" fill="#344054">Installs Cursor's own copy.</text>
<text x="50" y="1078" font-size="17" font-weight="700" fill="#1F2937">CI runs npm run verify</text>
<text x="50" y="1100" font-size="16" fill="#344054">on every push and pull request.</text>
<rect x="510" y="900" width="280" height="240" rx="16" fill="#FFF4E6" stroke="#E8590C" stroke-width="2.5"/>
<text x="530" y="934" font-size="25" font-weight="800" fill="#D9480F">Optional part</text>
<text x="530" y="966" font-size="17" font-weight="700" fill="#1F2937">Brief me and Meditate</text>
<text x="530" y="988" font-size="16" fill="#344054">Learning skills for Claude</text>
<text x="530" y="1010" font-size="16" fill="#344054">Code and Codex.</text>
<text x="530" y="1122" font-size="16" fill="#1F2937">Chosen at install.</text>
<rect x="830" y="900" width="580" height="240" rx="16" fill="#F3F0FF" stroke="#6741D9" stroke-width="2.5"/>
