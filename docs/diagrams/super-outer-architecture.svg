<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1460" width="1440" height="1460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Super-outer: how the parts connect</title>
<desc id="desc">The owner types to Claude Code, Codex or Cursor. Super-outer's prompt hook routes the typed words, the router skill reads the project's rules, loads only the specialists the route names and turns their findings into plain decisions, and the command layer keeps records in the owner's project and runs the tool check against public registries. Jev, an optional routing model reached through OpenRouter, is off until the owner adds a key.</desc>
<metadata id="diagram-facts">{"version":"6.6.0","hosts":["Claude Code","Codex","Cursor"],"hookEvents":["UserPromptSubmit","SessionStart","PreToolUse","Stop"],"cursorEvents":["beforeSubmitPrompt","preToolUse","stop"],"cursorSessionStart":false,"moduleCount":12,"reviewAgentCount":6,"shippedSkills":["draw-system-diagram","jev-opportunities","caveman-opportunities","edge-cases"],"optionalParts":["brief-me","meditate"],"jevHost":"openrouter.ai","jevCharacters":1500,"jevWithoutKey":"no_key","registries":["npm","PyPI","skills.sh","the MCP Registry","GitHub","unpkg"],"records":[".engineering/super-outer/current-task.json",".engineering/super-outer/ledger.json",".engineering/super-outer/tool-check.json",".engineering/super-outer/proof-obligations.json"],"installCommands":["npm run setup","npm run install:cursor"],"ciCommand":"npm run verify","example":{"request":"Add Google sign-in to my app","depth":"CRITICAL","questions":12,"specialists":["backend-api","delivery-release","frontend-client","security-privacy-abuse"]},"otherPath":{"request":"Fix the typo on the pricing page","depth":"SMALL_SAFE"}}</metadata>
