<text x="480" y="1002" font-size="14" font-weight="700" fill="#0C8599" text-anchor="middle">adds</text>
<rect x="30" y="1180" width="1380" height="250" rx="16" fill="#EDF2FF" stroke="#4263EB" stroke-width="2.5"/>
<text x="50" y="1214" font-size="21" font-weight="800" fill="#364FC7">A typical request, start to finish</text>
<text x="50" y="1248" font-size="17" fill="#1F2937">1. The owner types “Add Google sign-in to my app”. The prompt hook passes on only those typed words.</text>
<text x="50" y="1276" font-size="17" fill="#1F2937">2. Routing reads it as sign-in work: CRITICAL, up to 12 questions, and the security, backend, frontend and release specialists.</text>
<text x="50" y="1304" font-size="17" fill="#1F2937">3. The router reads the project's own rules first, then each of those four specialists returns its findings.</text>
<text x="50" y="1332" font-size="17" fill="#1F2937">4. The owner sees plain decisions, each with one recommendation, and answers them.</text>
<text x="50" y="1360" font-size="17" fill="#1F2937">5. The task record and the list of unproved checks are saved. Going live in production waits for one approval phrase.</text>
<text x="50" y="1400" font-size="17" fill="#1F2937">A request such as “Fix the typo on the pricing page” routes as SMALL_SAFE, and Super-outer stays quiet.</text>
</svg>
