<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1540" width="1440" height="1540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc" data-diagram="pipeline">
<title id="title">How the tool check finds tools for a project</title>
<desc id="desc">The tool check reads the project's package lists on the computer and sends out public package names and versions, vendor names and generic need words, never code. It looks them up on npm or PyPI and Expo's version table on unpkg, searches skills.sh by the project's vendors and needs, confirms each skill on GitHub, reads its safety scans and scans its text, and finds the vendors' MCP servers in the MCP Registry. The agent judges fit and writes at most four rows for the owner, and the owner's answer is recorded.</desc>
<metadata id="diagram-facts">{"registries":["npm","PyPI","skills.sh","the MCP Registry","GitHub","unpkg"],"lookups":{"package.json":"npm","requirements.txt":"PyPI","pyproject.toml":"PyPI"},"privateKinds":["private","local","workspace","git"],"versionTableHost":"unpkg.com","limits":{"maxRequests":500,"deadlineSeconds":90,"timeoutSeconds":10,"maxQueries":10,"keepPerQuery":3,"mcpPerPublisher":3},"maxNeeds":4,"failedScan":"hold","warnedScan":"shown with a note","textFlags":["hidden or direction-changing characters","downloads and runs a script"],"maxRows":4,"answers":["accepted","declined","later"],"laterDays":14,"recordPath":".engineering/super-outer/tool-check.json"}</metadata>
