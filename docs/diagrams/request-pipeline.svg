<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1440" width="1440" height="1440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc" data-diagram="pipeline">
<title id="title">How Super-outer handles one request</title>
<desc id="desc">The prompt hook keeps only the words the owner typed and chooses a depth, a question allowance and the specialists, with an optional second reading from Jev. The coding agent, following the router skill, reads the project's rules, runs the chosen specialist reviews, turns their findings into plain decisions, maps the journey for new work, plans and builds it, walks the launch steps, and keeps each kind of proof separate. Before an extremely critical action, the owner types one approval phrase that the hook checks.</desc>
<metadata id="diagram-facts">{"depths":["SMALL_SAFE","QUICK","FOCUSED","FULL","CRITICAL"],"questionAllowance":{"SMALL_SAFE":0,"QUICK":2,"FOCUSED":4,"FULL":7,"CRITICAL":7},"knownBuildAllowance":12,"jevCharacters":1500,"moduleCount":12,"approachDepths":["FOCUSED","FULL","CRITICAL"],"approachLines":["See","Stop","Shape","Tools"],"proofKinds":["source","CI","package","installation","user journey"],"approvalPhrase":"APPROVE SUPER-OUTER","approvalMinutes":15,"approvalUses":1}</metadata>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1971C2"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8590C"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B8A5F"/></marker>
