<text x="444.0" y="188.0" font-size="17" font-weight="700" fill="#122645" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Work under way</text>
<text x="444.0" y="212.0" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Joins a short follow-up to the current</text>
