<text x="380.0" y="588.0" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Bounded work, normally one specialist.</text>
<rect x="48.0" y="602.0" width="1104.0" height="34.0" rx="6" fill="#ffffff"/>
<text x="64.0" y="624.0" font-size="13" font-weight="750" fill="#122645" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">FOCUSED</text>
<text x="220.0" y="624.0" font-size="13" font-weight="600" fill="#2355af" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">1 to 4 questions</text>
<text x="380.0" y="624.0" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Shared or multi-file work, one or two specialists.</text>
<rect x="48.0" y="638.0" width="1104.0" height="34.0" rx="6" fill="#eef2f8"/>
<text x="64.0" y="660.0" font-size="13" font-weight="750" fill="#122645" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">FULL</text>
<text x="220.0" y="660.0" font-size="13" font-weight="600" fill="#2355af" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">1 to 7 questions</text>
<text x="380.0" y="660.0" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Cross-system, production-affecting or hard to undo.</text>
<rect x="48.0" y="674.0" width="1104.0" height="34.0" rx="6" fill="#ffffff"/>
<text x="64.0" y="696.0" font-size="13" font-weight="750" fill="#122645" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">CRITICAL</text>
<text x="220.0" y="696.0" font-size="13" font-weight="600" fill="#2355af" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">1 to 7 questions</text>
<text x="380.0" y="696.0" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Sign-in, payments, sensitive data, production. One consolidated interview.</text>
<text x="64.0" y="730.0" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">A matched anticipation library raises the ceiling to 12. A floor is met by one real question, or by one line saying why none was needed.</text>
<rect x="48.0" y="750.0" width="1104.0" height="96.0" rx="12" fill="#fff4dc" stroke="#e0b252" stroke-width="1.7"/>
<text x="64.0" y="774.0" font-size="11" font-weight="750" fill="#8a5a00" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" letter-spacing="0.8">BEFORE A TOOL RUNS  /  src/approval.mjs</text>
<text x="64.0" y="798.0" font-size="15" font-weight="700" fill="#122645" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Approval gate: warn first, stop rarely</text>
<text x="64.0" y="820.0" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Ordinary edits, tests, commits and pull requests never wait. Only an extreme consequence asks for APPROVE SUPER-OUTER &lt;token&gt;: one use, 15 minutes.</text>
<text x="32.0" y="880.0" font-size="12" font-weight="500" fill="#5b6778" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Release 6.6.0. Drawn 25 November 2026 from the source in this repository. Label: observed in source.</text>
