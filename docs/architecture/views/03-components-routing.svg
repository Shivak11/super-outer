<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">C5 view 3: components on the routing path</title><desc id="desc">Six steps turn a typed request into route lines: the host-block filter, the work-under-way record, the router, the optional Jev reading, the question allowance and specialist choice, and the route context the agent reads. Before a tool runs, the approval gate warns first and asks for a typed phrase only for an extreme consequence.</desc>
