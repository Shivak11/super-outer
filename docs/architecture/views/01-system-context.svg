<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">C5 view 1: system context</title><desc id="desc">The product owner types a request in Claude Code, Codex or Cursor. The host runs Super-outer. Super-outer reads the working repository first and writes local records. It sends package and vendor names to public registries, reads CI results, and sends typed words to the optional Jev routing model only when the owner switches it on.</desc>
