<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="828" viewBox="0 0 1120 828" role="img" aria-labelledby="title desc"><title id="title">Super-Outer architecture</title><desc id="desc">A non-technical creator brings an idea to a coding host. The user installs local guidance. The model reads the project, sizes the change, and follows a tiny, local or wide lane. The owner request and host permissions gate tool actions; evidence returns to the creator. A separate synthetic evaluation loop updates the skill only through maintainer review.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4d6487"/></marker></defs>
<rect x="0" y="0" width="1120" height="828" rx="22" fill="#f5f7fb" stroke="#f5f7fb" stroke-width="1.7" />
<rect x="0" y="0" width="1120" height="114" rx="18" fill="#142643"/>
<text x="32" y="37" font-size="13" font-weight="800" fill="#ade0fc" font-family="system-ui, sans-serif">SUPER-OUTER   /   PUBLIC SKILL ARCHITECTURE</text>
<text x="32" y="82" font-size="34" font-weight="750" fill="#ffffff" font-family="system-ui, sans-serif">From a creative idea to a change you can check</text>
<rect x="28" y="137" width="329" height="104" rx="12" fill="#fff" stroke="#c7d1df" stroke-width="1.7" />
<text x="44" y="160" font-size="11" font-weight="750" fill="#2355af" font-family="system-ui, sans-serif">01  /  YOU</text>
<text x="44" y="184" font-size="18" font-weight="700" fill="#122645" font-family="system-ui, sans-serif">Bring a creative brief</text>
<text x="44" y="204" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Say what a person should be able to do.</text>
<text x="44" y="221" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">No coding vocabulary required.</text>
<rect x="391" y="137" width="329" height="104" rx="12" fill="#fff" stroke="#c7d1df" stroke-width="1.7" />
<text x="407" y="160" font-size="11" font-weight="750" fill="#2355af" font-family="system-ui, sans-serif">02  /  LOCAL INSTALL</text>
<text x="407" y="184" font-size="18" font-weight="700" fill="#122645" font-family="system-ui, sans-serif">Add the skill deliberately</text>
<text x="407" y="204" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Vercel CLI copies SKILL.md + references.</text>
<text x="407" y="221" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">No hooks or background telemetry.</text>
<rect x="754" y="137" width="338" height="104" rx="12" fill="#e7efff" stroke="#87a7e9" stroke-width="1.7" />
<text x="770" y="160" font-size="11" font-weight="750" fill="#2355af" font-family="system-ui, sans-serif">03  /  AGENT HOST</text>
<text x="770" y="184" font-size="18" font-weight="700" fill="#122645" font-family="system-ui, sans-serif">Claude Code or Codex</text>
<text x="770" y="204" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Loads the skill alongside project rules.</text>
<text x="770" y="221" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">The host controls access to tools.</text>
<path d="M357 188 H388" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<path d="M720 188 H751" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<path d="M922 241 V258" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<rect x="28" y="260" width="1064" height="260" rx="12" fill="#ffffff" stroke="#a3b8d9" stroke-width="1.7" />
<text x="46" y="287" font-size="12" font-weight="800" fill="#2355af" font-family="system-ui, sans-serif">04  /  ADVISORY WORKFLOW</text>
<text x="46" y="317" font-size="21" font-weight="670" fill="#122645" font-family="system-ui, sans-serif">Read the project, then size the change by what could break and who would notice.</text>
<path d="M208.0 322 V337" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<rect x="46" y="339" width="324" height="107" rx="12" fill="#f5f8ff" stroke="#b4c6e6" stroke-width="1.7" />
<text x="62" y="362" font-size="11" font-weight="750" fill="#2355af" font-family="system-ui, sans-serif">TINY  /  LOW IMPACT</text>
<text x="62" y="386" font-size="18" font-weight="700" fill="#122645" font-family="system-ui, sans-serif">Make the small fix</text>
<text x="62" y="406" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Check the exact label or behaviour.</text>
<text x="62" y="423" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Skip the design ceremony.</text>
<path d="M208.0 446 V467" fill="none" stroke="#4d6487" stroke-width="2"  />
<path d="M555.0 322 V337" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<rect x="393" y="339" width="324" height="107" rx="12" fill="#f5f8ff" stroke="#b4c6e6" stroke-width="1.7" />
<text x="409" y="362" font-size="11" font-weight="750" fill="#2355af" font-family="system-ui, sans-serif">LOCAL  /  REVERSIBLE</text>
<text x="409" y="386" font-size="18" font-weight="700" fill="#122645" font-family="system-ui, sans-serif">Walk the user journey</text>
<text x="409" y="406" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Include a return visit or failure path.</text>
<text x="409" y="423" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Recommend a safe default and a test.</text>
<path d="M555.0 446 V467" fill="none" stroke="#4d6487" stroke-width="2"  />
<path d="M907.0 322 V337" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<rect x="740" y="339" width="334" height="107" rx="12" fill="#f5f8ff" stroke="#b4c6e6" stroke-width="1.7" />
<text x="756" y="362" font-size="11" font-weight="750" fill="#2355af" font-family="system-ui, sans-serif">WIDE  /  HIGH CONSEQUENCE</text>
<text x="756" y="386" font-size="18" font-weight="700" fill="#122645" font-family="system-ui, sans-serif">Stop at the real decision</text>
<text x="756" y="406" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Name the risk, recovery and trade-off.</text>
<text x="756" y="423" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Wait for any approval needed to act.</text>
<path d="M907.0 446 V467" fill="none" stroke="#4d6487" stroke-width="2"  />
<path d="M208 467 H907" fill="none" stroke="#4d6487" stroke-width="2"  />
<path d="M555 467 V486" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<text x="46" y="503" font-size="15" font-weight="570" fill="#243451" font-family="system-ui, sans-serif">No implementation requested? Return the recommendation and the proof plan.</text>
<path d="M560 520 V534 H191 V546" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<rect x="28" y="549" width="329" height="102" rx="12" fill="#e7efff" stroke="#87a7e9" stroke-width="1.7" />
<text x="44" y="572" font-size="11" font-weight="750" fill="#2355af" font-family="system-ui, sans-serif">05  /  EXECUTION BOUNDARY</text>
<text x="44" y="596" font-size="18" font-weight="700" fill="#122645" font-family="system-ui, sans-serif">Check scope and permissions</text>
<text x="44" y="616" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">No or denied: stop that action.</text>
<text x="44" y="633" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Yes: use the host’s permitted tools.</text>
<rect x="391" y="549" width="329" height="102" rx="12" fill="#fff" stroke="#c7d1df" stroke-width="1.7" />
<text x="407" y="572" font-size="11" font-weight="750" fill="#2355af" font-family="system-ui, sans-serif">06  /  DELIVERY</text>
<text x="407" y="596" font-size="18" font-weight="700" fill="#122645" font-family="system-ui, sans-serif">Change, then check</text>
<text x="407" y="616" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Run a test a user could reproduce.</text>
<text x="407" y="633" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">Keep local and release evidence separate.</text>
<rect x="754" y="549" width="338" height="102" rx="12" fill="#fff" stroke="#c7d1df" stroke-width="1.7" />
<text x="770" y="572" font-size="11" font-weight="750" fill="#2355af" font-family="system-ui, sans-serif">07  /  BACK TO YOU</text>
<text x="770" y="596" font-size="18" font-weight="700" fill="#122645" font-family="system-ui, sans-serif">Show the evidence</text>
<text x="770" y="616" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">What changed, what passed,</text>
<text x="770" y="633" font-size="13" font-weight="500" fill="#243451" font-family="system-ui, sans-serif">and what remains unverified.</text>
<path d="M357 599 H388" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<path d="M720 599 H751" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<rect x="28" y="682" width="1064" height="112" rx="12" fill="#eef4ec" stroke="#a2ba9d" stroke-width="1.7" stroke-dasharray="7 5"/>
<text x="46" y="712" font-size="12" font-weight="800" fill="#396348" font-family="system-ui, sans-serif">SEPARATE EVAL LOOP  /  NO LIVE SESSION COLLECTION</text>
<text x="46" y="749" font-size="17" font-weight="650" fill="#1c3b2a" font-family="system-ui, sans-serif">Synthetic fixture</text>
<text x="287" y="749" font-size="17" font-weight="650" fill="#1c3b2a" font-family="system-ui, sans-serif">Fresh agent response</text>
<text x="568" y="749" font-size="17" font-weight="650" fill="#1c3b2a" font-family="system-ui, sans-serif">Rubric + structural checks</text>
<text x="878" y="749" font-size="17" font-weight="650" fill="#1c3b2a" font-family="system-ui, sans-serif">Review the skill</text>
<path d="M213 744 H266" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<path d="M491 744 H548" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<path d="M821 744 H859" fill="none" stroke="#4d6487" stroke-width="2"  marker-end="url(#arr)"/>
<text x="46" y="778" font-size="14" font-weight="500" fill="#325544" font-family="system-ui, sans-serif">Maintainers can revise a later release. No evaluation is performed automatically when you install or use the skill.</text>
</svg>
