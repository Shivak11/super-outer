interface:
  display_name: "Find closed-decision LLM calls"
  short_description: "Finds LLM calls that only pick a label, yes or no, route or score, and names the engine that should make each one"
  default_prompt: "Use $jev-opportunities to find LLM calls in this project that only make a closed decision and say which engine should make each one."
policy:
  allow_implicit_invocation: true
