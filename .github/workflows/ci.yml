name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SUPER_OUTER_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Confirm the exact candidate
        run: node scripts/verify-ci-head.mjs

      - name: Verify source, tests, package, and isolated staging
        run: npm run verify

      - name: Check patch formatting
        run: git diff --check

  node-24:
    name: Node.js 24
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Confirm the exact candidate
        run: node scripts/verify-ci-head.mjs

      - name: Verify the supported runtime
        run: npm run verify
